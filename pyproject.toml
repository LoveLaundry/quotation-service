[project]
name = "quotation-service"
version = "0.1.0"
description = "Quotation Service API"
readme = "README.md"
authors = [
    { name = "DulshanSiriwardhana", email = "dulshansiriwardhanaofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.30.0",
    "pymongo>=4.10.1",
    "dnspython>=2.6.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "cryptography>=42.0.0",
    "pyjwt>=2.7.0",
    "starlette>=0.41.0",
    "sentry-sdk>=1.40.0",
    "sqlalchemy>=2.0.51",
]

[tool.vercel]
entrypoint = "api.index:app"